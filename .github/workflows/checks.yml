name: Checks

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: checks-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  powershell:
    name: Windows / powershell
    runs-on: windows-latest
    timeout-minutes: 10
    steps:
      - name: Check out source
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          persist-credentials: false
      - name: Run fixture-based checks
        shell: powershell
        run: ./toolkit/Test-SupportSnapshot.ps1
      - name: Validate live Windows snapshot
        shell: powershell
        run: ./toolkit/Test-WindowsSnapshot.ps1
  pwsh:
    name: Windows / pwsh
    runs-on: windows-latest
    timeout-minutes: 10
    steps:
      - name: Check out source
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          persist-credentials: false
      - name: Run fixture-based checks
        shell: pwsh
        run: ./toolkit/Test-SupportSnapshot.ps1
      - name: Validate live Windows snapshot
        shell: pwsh
        run: ./toolkit/Test-WindowsSnapshot.ps1
